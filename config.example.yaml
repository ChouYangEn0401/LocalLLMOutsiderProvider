# LocalLLMOutsiderProvider (llmop) v0.2 - example config
# Easiest start:  llmop init   (or Start.bat in the Windows portable zip) creates
# config.yaml from this file and asks for the admin password.
# The file is re-read automatically when it changes; no restart needed for
# accounts / tiers / quotas / backends / model. Ports, listeners and tunnels need a restart.
# config.yaml is in .gitignore - never commit real password hashes.
#
# What runs (llmop serve):
#   local console + key-less /v1   http://127.0.0.1:<listeners.local>      this computer only
#   account website                http://127.0.0.1:<listeners.public_ui>  -> tunnel "ui"
#   API link                       http://127.0.0.1:<listeners.public_api>/<secret>/v1
#                                  (+ /<secret>/e2e/v1 encrypted, /<secret>/worker/ws) -> tunnel "api"

server:
  host: 127.0.0.1          # keep 127.0.0.1; the tunnel connects locally. Docker sets 0.0.0.0.
  port: 8780               # only for the v0.1 single-listener mode (llmop serve --port N);
                           # the v0.2 node uses "listeners" below
  data_dir: ./data         # SQLite file (keys, sessions, usage records) lives here
  public_url: ""           # fixed URL of the ACCOUNT WEBSITE (named tunnel / own domain).
                           # Empty = the quick-tunnel URL. The API link: tunnels.api.public_url
  session_minutes: 720     # web login lasts 12 hours
  cookie_secure: auto      # auto | always | never
  title: "Local LLM Outsider Provider"
  public_stream: false     # allow "stream": true on the public API link. Off by default:
                           # quick tunnels do not support SSE reliably. The local /v1 always streams.
                           # Encrypted requests (/e2e/v1) never stream in v0.2.

# What this machine runs: gateway (API + accounts + web), worker (decrypts next to
# the LLM, for encrypted keys), client (local proxy that encrypts for your apps).
# Encrypted keys on this computer:  roles: [gateway, worker]  and run once
#   llmop worker init    (keys + settings in $LLMOP_HOME/worker; check its "backends")
# The node then starts the worker itself. Needs: pip install "localllm-outsider-provider[secure]"
roles: [gateway]

# The one model every request uses. The "model" field of a request is always replaced
# by this and /v1/models lists only it. Empty = not set (requests keep their model;
# the startup check warns). Example:  model: qwen3.5:9b
model: ""

# Local LLM servers behind the gateway. type: ollama | vllm | lmstudio | llamacpp | openai
# All are reached through their OpenAI-compatible /v1 API; Ollama also gets
# native extras (model listing from /api/tags, context length from /api/show).
backends:
  - name: ollama
    type: ollama
    base_url: http://127.0.0.1:11434   # in Docker compose: http://ollama:11434
    models: ["*"]                      # expose all models, or list e.g. ["qwen3.5:9b"]
    max_concurrency: 2                 # requests sent to this server at once (protect the GPU)
    timeout: 600                       # seconds without progress before giving up
    # Ollama's default context is small (4096 on many builds) and it SILENTLY drops
    # the start of long prompts. Ollama's /v1 API ignores per-request num_ctx, so set
    # it on the Ollama side: env OLLAMA_CONTEXT_LENGTH=8192 (or Modelfile num_ctx).
    context_size: 0                    # sent as options.num_ctx (best effort; see above)
  # - name: vllm
  #   type: vllm
  #   base_url: http://127.0.0.1:8000
  #   api_key: env:VLLM_API_KEY        # if vLLM was started with --api-key
  #   models: ["*"]

# Optional friendly names ("model": "fast" -> qwen3.5:9b), from v0.1. Not shown in
# v0.2 (one model, see "model" above); kept so old configs still load.
model_aliases:
  # fast: qwen3.5:9b

# v0.1 limits, applied to every account unless the account overrides a value.
# 0 = unlimited. In v0.2 the tiers and the two usage meters below decide who may
# send how much; requests_per_minute / max_tokens_per_request stay as safety limits.
default_quota:
  tokens_per_day: 200000
  tokens_per_month: 3000000
  requests_per_minute: 20
  requests_per_day: 0
  max_concurrent: 2
  max_tokens_per_request: 4096

# Accounts. tier: vip3 | vip2 | vip1 | normal (default normal); any tier value
# (bucket, weekly, max_concurrent, ...) can be overridden per account.
# LOW is not a tier: a NORMAL account becomes LOW by itself when its 1.5-hour bucket
# is empty. GUEST is not an account: GUEST keys are issued in the local console.
# max_api_keys: default 1; 0 = this account cannot create API keys.
# Accounts log in on the account website and create their own keys there
# (per key: encryption required | optional).
# Create a password hash with:   llmop hash-password
# (or: python -m llmop hash-password)
accounts:
  admin:
    role: admin
    tier: vip3
    display_name: Owner
    password_hash: "REPLACE_ME_run_llmop_hash-password"
    quota:
      tokens_per_day: 0        # unlimited for the owner
      tokens_per_month: 0
  # friend1:
  #   role: user
  #   tier: normal             # or e.g. vip1, and override one value:  bucket: 300000
  #   display_name: Friend
  #   password_hash: "scrypt$32768$8$1$...."
  #   models: ["qwen3.5:9b"]   # which models this account may use ("*" = all)
  #   max_api_keys: 3
  #   quota:
  #     tokens_per_day: 50000

# Cloudflare tunnel, v0.1 single tunnel: used only by "llmop serve --port N" and plain
# "llmop tunnel". The v0.2 node uses "tunnels" below.
# (needs cloudflared: winget install --id Cloudflare.cloudflared)
tunnel:
  enabled: false
  mode: quick              # quick = random https://xxx.trycloudflare.com (changes every start)
                           # named = your own domain, stable URL (needs token)
  cloudflared: cloudflared # path to cloudflared(.exe) if not on PATH
  token: ""                # mode: named -> env:CLOUDFLARE_TUNNEL_TOKEN

# The local, key-less /v1 (http://127.0.0.1:<listeners.local>/v1) is billed to this
# account and queued with its tier. Empty = the first admin account.
local_account: ""

# Ports of the three entry points (all on 127.0.0.1).
listeners:
  local: 8781              # local console + key-less /v1 (this machine only)
  public_ui: 8780          # account website (tunnel "ui")
  public_api: 8782         # API link: /<secret>/v1, /<secret>/e2e/v1, /<secret>/worker/ws (tunnel "api")

# Two independent tunnels. "ui" (account website) is rarely restarted; "api" can be
# replaced at any time ("rotate API link": llmop tunnel rotate-api, or the button in
# the local console) without touching "ui". "llmop serve --tunnel" starts both,
# "--no-tunnel" none. Keys per tunnel (all optional):
#   mode: quick (random https://xxx.trycloudflare.com, changes at every start)
#         | named (your own domain: token + public_url) | off
#   cloudflared: path to cloudflared(.exe) if not on PATH
#   token: env:CLOUDFLARE_TUNNEL_TOKEN_UI     (mode: named)
#   public_url: https://llm.example.com       (mode: named; this tunnel's own URL)
tunnels:
  ui:
    enabled: false
    mode: quick
    public_url: ""
  api:
    enabled: false
    mode: quick
    public_url: ""

# Usage meters (docs/plan/TIERS_AND_USAGE_RULES.md). Usage is counted after each request.
usage:
  window_seconds: 5400     # the 1.5-hour bucket refills from empty to full in this time
  recover_at: 0.25         # LOW goes back to NORMAL when the bucket is back to 25%
  debt_floor: 0.25         # the bucket may go down to -25%
  low_mode: wait           # wait = LOW waits behind everyone | block = 429 until recovered
  week_reset: { weekday: sun, time: "04:00", timezone: local }   # local or e.g. Asia/Taipei

# Tiers. No bucket / weekly = not limited. Leave out a tier to keep these defaults.
# bucket = 1.5-hour meter (tokens), weekly = weekly meter, priority 1 = served first.
# vip1 on_bucket_empty: as_normal = queue like NORMAL until the bucket is back to 25%
# (low = become LOW like NORMAL). guest: budget = total tokens per GUEST key,
# reset: true = the budget resets weekly instead of the key running out.
tiers:
  vip3:   { priority: 1, max_concurrent: 3 }
  vip2:   { priority: 2, max_concurrent: 2 }
  vip1:   { priority: 3, max_concurrent: 2, bucket: 240000, weekly: 3000000, on_bucket_empty: as_normal }
  normal: { priority: 4, max_concurrent: 1, bucket: 80000,  weekly: 1000000 }
  guest:  { priority: 5, max_concurrent: 1, bucket: 20000,  budget: 50000, reset: false }

# Queue for the shared slots.
queue:
  slots: 6                 # requests running at once. Must match the backend's parallel
                           # slots: llama.cpp / LM Studio split the context over them
  max_length: 30           # whole queue; more -> 503
  max_per_account: 2       # waiting requests per account; more -> 429
  max_wait_seconds: { public: 60, local: 600 }
  fair_share_every: 6      # every 6th start goes to the longest-waiting NORMAL / GUEST
