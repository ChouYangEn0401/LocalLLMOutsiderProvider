[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localllm-outsider-provider"
dynamic = ["version"]
description = "Expose local LLM services (Ollama / vLLM / any OpenAI-compatible server) to online users with lightweight session login, API keys and token quotas."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ChouYangEn0401" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "PyYAML>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
secure = ["cryptography>=47", "aiohttp>=3.9", "websockets>=12"]
dev = ["pytest>=8", "respx>=0.21", "build>=1.0", "pytest-aiohttp", "pytest-asyncio", "pyhpke"]

[project.scripts]
llmop = "llmop.__main__:main"

[project.urls]
Homepage = "https://github.com/ChouYangEn0401/LocalLLMOutsiderProvider"

[tool.setuptools.dynamic]
version = { attr = "llmop.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmop = ["web/static/*", "examples/*"]
"llmop.gateway" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
