[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localllm-outsider-provider"
dynamic = ["version"]
description = "Expose local LLM services (Ollama / vLLM / any OpenAI-compatible server) to online users with lightweight session login, API keys and token quotas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ChouYangEn0401" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "PyYAML>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "build>=1.0"]

[project.scripts]
llmop = "llmop.cli:main"

[project.urls]
Homepage = "https://github.com/ChouYangEn0401/LocalLLMOutsiderProvider"

[tool.setuptools.dynamic]
version = { attr = "llmop.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmop = ["web/static/*", "examples/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
