[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localllm-outsider-provider"
dynamic = ["version"]
description = "Share a local LLM (Ollama / LM Studio / vLLM / any OpenAI-compatible server) with a few people over Cloudflare tunnels: accounts, API keys, tiers, usage meters, a queue and optional end-to-end encryption."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ChouYangEn0401" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "tzdata; sys_platform == \"win32\"",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
secure = ["cryptography>=47", "aiohttp>=3.9", "websockets>=12"]
# [dev] alone is enough to run every test: it pulls in [secure] (cryptography, aiohttp,
# websockets), which the encrypted-relay tests import.
dev = ["localllm-outsider-provider[secure]", "pytest>=8", "respx>=0.21", "build>=1.0",
       "pytest-aiohttp>=1.0", "pytest-asyncio>=0.23", "pyhpke"]

[project.scripts]
llmop = "llmop.__main__:main"

[project.urls]
Homepage = "https://github.com/ChouYangEn0401/LocalLLMOutsiderProvider"

[tool.setuptools.dynamic]
version = { attr = "llmop.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmop = ["web/static/*", "examples/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
