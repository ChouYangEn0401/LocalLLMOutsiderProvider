name: CI

on:
  push:
    branches: ["**"]   # tag pushes (v*) are tested by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]   # requires-python >= 3.11
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,secure]"

      - name: Test
        run: python -m pytest -q

  docker:
    name: Docker image and compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        working-directory: docker
        run: |
          for f in compose.ollama.yml compose.vllm.yml compose.host-ollama.yml; do
            echo "== $f"
            docker compose -f "$f" config -q
            docker compose -f "$f" -f compose.tunnel.yml config -q
          done

      - name: Build image
        run: docker build -f docker/Dockerfile -t llmop:ci .

      - name: Smoke test image
        run: |
          docker run --rm llmop:ci --version
          mkdir -p smoke
          cp docker/config.docker.example.yaml smoke/config.yaml
          # the placeholder password must make "serve" refuse to start (exit code 2)
          set +e
          docker run --rm -v "$PWD/smoke:/config:ro" llmop:ci
          code=$?
          set -e
          test "$code" = "2"
