<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>入口 · {{title}}</title>
<link rel="icon" href="/ui/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/static/app.css?v={{v}}">
<script src="/ui/static/common.js?v={{v}}" defer></script>
<script src="/ui/static/dashboard.js?v={{v}}" defer></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner" id="topbar"></div></header>

<main class="container">
  <section class="section" aria-labelledby="h-status">
    <div class="section-head">
      <h2 id="h-status">狀態與用量 (Status &amp; usage)</h2>
      <button class="btn small ghost" id="refresh" type="button">重新整理</button>
    </div>
    <div class="grid stats" id="status-cards"><div class="card stat muted">載入中…</div></div>
  </section>

  <section class="section" aria-labelledby="h-link">
    <div class="section-head">
      <h2 id="h-link">API 連結 (API link)</h2>
      <p class="small muted">連結可能被管理員更換；金鑰不受影響，改一下 base_url 即可。</p>
    </div>
    <div class="card" id="api-link"></div>
  </section>

  <section class="section" aria-labelledby="h-keys">
    <div class="section-head">
      <h2 id="h-keys">我的 API 金鑰 (My API keys)</h2>
      <p class="small muted" id="keys-count"></p>
    </div>
    <div class="card">
      <form id="key-form" class="row-form" method="post" novalidate>
        <div class="field grow">
          <label for="key-name">名稱 (name)</label>
          <input id="key-name" name="name" type="text" maxlength="60" autocomplete="off"
                 placeholder="例如：筆電、手機、Open WebUI">
        </div>
        <div class="field">
          <label for="key-expires">有效期限 (expires)</label>
          <select id="key-expires" name="expires">
            <option value="">永不過期</option>
            <option value="7">7 天</option>
            <option value="30">30 天</option>
            <option value="90">90 天</option>
            <option value="365">1 年</option>
          </select>
        </div>
        <div class="field">
          <label for="key-encryption">加密 (encryption)</label>
          <select id="key-encryption" name="encryption">
            <option value="optional">可不加密 (optional)</option>
            <option value="required">一定加密 (required)</option>
          </select>
        </div>
        <button class="btn primary" id="key-create" type="submit">申請新金鑰</button>
      </form>
      <div class="field">
        <label for="key-sig">簽章公鑰 (signing public key) <small class="muted">— 加密金鑰必填；用 llmop client keygen 產生</small></label>
        <input id="key-sig" name="sig_public_key" type="text" maxlength="100" autocomplete="off" spellcheck="false"
               placeholder="b64u，43 個字元">
      </div>
      <p class="form-error" id="key-error" role="alert"></p>
      <div id="new-key"></div>
    </div>
    <div class="card flush"><div class="table-wrap" id="keys-table"></div></div>
  </section>

  <section class="section" aria-labelledby="h-queue">
    <div class="section-head"><h2 id="h-queue">排隊狀況 (Queue)</h2></div>
    <div class="card" id="queue"></div>
  </section>

  <section class="section" aria-labelledby="h-howto">
    <div class="section-head"><h2 id="h-howto">怎麼用 (How to use)</h2></div>
    <div class="card" id="howto"></div>
  </section>

  <section class="section" aria-labelledby="h-recent">
    <div class="section-head">
      <h2 id="h-recent">最近請求 (Recent requests)</h2>
      <p class="small muted">最近 50 筆</p>
    </div>
    <div class="card flush"><div class="table-wrap" id="recent"></div></div>
  </section>
</main>
</body>
</html>
